<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú</title>
  <!-- Versión clásica ultra compatible con todos los celulares -->
  <script src="https://cloudflare.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f9f6f2; }

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #e5e0d8;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
    }

    nav::-webkit-scrollbar { display: none; }

    nav button {
      background: #f0ebe3;
      color: #3e2723;
      border: none;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      flex-shrink: 0;
    }

    nav button:active {
      background: #3e2723;
      color: #ffffff;
    }

    #estado {
      text-align: center;
      padding: 50px 20px;
      color: #6d4c41;
      font-size: 15px;
    }

    #pdf-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    canvas {
      width: 100%;
      max-width: 650px;
      height: auto !important;
      display: block;
    }
  </style>
</head>
<body>

  <nav id="navbar">
    <button onclick="irAPixel(0)">Inicio</button>
    <button onclick="irAPixel(1200)">Cafetería</button>
    <button onclick="irAPixel(3200)">Pastelería</button>
    <button onclick="irAPixel(5400)">Almuerzos</button>
    <button onclick="irAPixel(7000)">Bebidas</button>
  </nav>

  <div id="estado">Cargando carta...</div>
  <div id="pdf-container"></div>

  <script>
    const ALTO_ORIGINAL_DISENO = 8000;
    const estado = document.getElementById('estado');

    async function iniciar() {
      try {
        // 1. Descarga el archivo menu.pdf como datos puros
        const respuesta = await fetch('./menu.pdf?v=' + Date.now());
        if (!respuesta.ok) {
          throw new Error('No se encontró menu.pdf (Código ' + respuesta.status + ')');
        }
        const buffer = await respuesta.arrayBuffer();

        // 2. Abre el PDF sin usar workers externos que se bloquean
        const pdf = await pdfjsLib.getDocument({
          data: buffer,
          disableWorker: true
        }).promise;

        const contenedor = document.getElementById('pdf-container');
        estado.style.display = 'none';

        for (let num = 1; num <= pdf.numPages; num++) {
          const page = await pdf.getPage(num);
          // Escala 0.5: crea una imagen de 990x4000px (nítida y aprobada por todos los celulares)
          const viewport = page.getViewport({ scale: 0.5 });

          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          contenedor.appendChild(canvas);

          await page.render({
            canvasContext: canvas.getContext('2d'),
            viewport: viewport
          }).promise;
        }
      } catch (err) {
        estado.style.color = '#c62828';
        estado.innerText = 'Error: ' + err.message;
      }
    }

    function irAPixel(pixelEnDiseno) {
      const contenedor = document.getElementById('pdf-container');
      const barraAltura = document.getElementById('navbar').offsetHeight;
      const posicionReal = (pixelEnDiseno / ALTO_ORIGINAL_DISENO) * contenedor.offsetHeight;
      
      window.scrollTo({
        top: Math.max(0, posicionReal - barraAltura - 10),
        behavior: 'smooth'
      });
    }

    iniciar();
  </script>
</body>
</html>
