<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f9f6f2; }

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #e5e0d8;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
    }

    nav::-webkit-scrollbar { display: none; }

    nav button {
      background: #f0ebe3;
      color: #3e2723;
      border: none;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      flex-shrink: 0;
    }

    nav button:active {
      background: #3e2723;
      color: #ffffff;
    }

    .contenedor {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    #visor-drive {
      width: 100%;
      max-width: 650px;
      aspect-ratio: 1980 / 8000;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <nav id="navbar">
    <button onclick="irAPixel(0)">Inicio</button>
    <button onclick="irAPixel(1200)">Cafetería</button>
    <button onclick="irAPixel(3200)">Pastelería</button>
    <button onclick="irAPixel(5400)">Almuerzos</button>
    <button onclick="irAPixel(7000)">Bebidas</button>
  </nav>

  <div class="contenedor">
    <iframe id="visor-drive"></iframe>
  </div>

  <script>
    // PEGÁ AQUÍ EL ENLACE QUE COPIASTE DE GOOGLE DRIVE
    const ENLACE_DE_GOOGLE_DRIVE = 'https://drive.google.com/file/d/1313aU2pU8aXNOlWyXA0t32W8ic8nis49/view?usp=drive_link';
    
    const ALTO_ORIGINAL_DISENO = 8000;

    // Convierte automáticamente tu link de compartir en un visor incrustado limpio
    const idArchivo = ENLACE_DE_GOOGLE_DRIVE.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (idArchivo) {
      document.getElementById('visor-drive').src = `https://google.com{idArchivo[1]}/preview`;
    }

    function irAPixel(pixelEnDiseno) {
      const visor = document.getElementById('visor-drive');
      const barraAltura = document.getElementById('navbar').offsetHeight;
      const posicionReal = (pixelEnDiseno / ALTO_ORIGINAL_DISENO) * visor.offsetHeight;
      
      window.scrollTo({
        top: Math.max(0, posicionReal - barraAltura - 10),
        behavior: 'smooth'
      });
    }
  </script>
</body>
</html>
